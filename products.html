<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Petshop Chiquitines</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app-styles.css">
    <link rel="stylesheet" href="app-native.css">
    <link rel="stylesheet" href="promo-modal.css">
</head>
<body>
    <header class="header" role="banner">
        <div class="container">
            <div class="header-content">
                <nav class="nav-desktop" role="navigation" aria-label="Navegación principal">
                    <a href="index.html" class="nav-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        </svg>
                        <span>Inicio</span>
                    </a>
                    <a href="products.html" class="nav-link active" aria-current="page">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        </svg>
                        <span>Productos</span>
                    </a>
                </nav>
                <div class="header-actions">
                    <button class="header-icon-btn" onclick="openFavoritesModal()" aria-label="Mis favoritos">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="fav-count" id="favCount" style="display:none">0</span>
                    </button>
                    <a href="cart.html" class="cart-icon" aria-label="Carrito">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="products-page">
        <div class="container">
            <h1>Productos</h1>
            <div id="productsGrid" class="products-grid"></div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Chiquitines Py</p>
    </footer>

    <a href="https://wa.me/595976106726" class="whatsapp-fab" target="_blank" rel="noopener noreferrer">
        <img src="assets/whatsapp.png" alt="WhatsApp" width="30" height="30">
    </a>

    <!-- App Native Enhancement -->
    <script src="app-native.js" defer></script>
    
    <!-- App Scripts -->
    <script src="app.js" defer></script>
    <script src="app-mode.js" defer></script>
    <script src="promo-modal.js" defer></script>
    
    <!-- Configuración del modal de promoción -->
    <script defer>
        window.promoConfig = {
            imageUrl: 'assets/promo.jpg',
            instagramUrl: 'https://www.instagram.com/p/DdJ4XbCBMcd/',
            showOncePerSession: true,
            delay: 800
        };
    </script>

    <!-- PWA Service Worker -->
    <script defer>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.warn('[PWA] SW no registrado:', err));
            }, { passive: true });
        }
    </script>
</body>
</html>
